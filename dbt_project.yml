name: 'dbt_pipeline_utils'
version: '1.0.0'
config-version: 2

# Export macros and generic test definitions, but not standalone tests.
# Generic tests live beside their helpers; test-paths stays empty so package
# installation does not activate project-specific checks or example tests.
macro-paths: ["macros"]
model-paths: []
seed-paths: []
snapshot-paths: []
analysis-paths: []
test-paths: []

clean-targets:
  - "target"
  - "dbt_packages"
